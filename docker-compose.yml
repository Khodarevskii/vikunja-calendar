services:
  vikunja:
    image: vikunja-subtask:latest
    container_name: vikunja-subtask
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      # Замени на публичный URL, по которому открываешь Vikunja в браузере.
      # Без https:// фронтенд не сможет собрать правильные ссылки.
      VIKUNJA_SERVICE_PUBLICURL: http://localhost:3456
      # ОБЯЗАТЕЛЬНО: тот же JWT-секрет, что и в старой установке,
      # иначе все пользователи разлогинятся и придётся сбрасывать сессии.
      VIKUNJA_SERVICE_JWTSECRET: CHANGE_ME
    volumes:
      # Папка с существующей БД SQLite. Положи сюда старый vikunja.db.
      - ./db:/db
      # Папка с аттачментами. Перенеси из старой установки.
      - ./files:/app/vikunja/files
